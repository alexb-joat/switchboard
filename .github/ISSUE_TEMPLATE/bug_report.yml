name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't open an issue — report it privately via the Security tab ("Report a vulnerability").
        Never paste API keys, prompts with personal data, or your full `.env`.
  - type: textarea
    id: what
    attributes: {label: What happened, description: And what you expected instead}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: "Include `python -m trioditis explain \"...\"` output if it's a routing issue"}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "Kubuntu 24.04, Python 3.12, Trioditis 0.3.0"}
    validations: {required: true}
