name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: The problem, description: "What are you trying to do that is hard today?"}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposed solution}
  - type: checkboxes
    id: deps
    attributes:
      label: Footprint
      options:
        - label: This would need a new dependency or a new outbound network call
