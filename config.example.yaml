# Trioditis config. Copy to config.yaml and edit.
# Secrets never go in this file: providers reference an env var (api_key_env).
# A cloud provider whose env var is unset is simply skipped.

providers:
  ollama:
    base_url: http://localhost:11434/v1        # Docker: http://host.docker.internal:11434/v1
    local: true                                # data stays on your machine
  anthropic:
    base_url: https://api.anthropic.com/v1     # OpenAI-compatible endpoint
    api_key_env: ANTHROPIC_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  openrouter:                                  # long tail, incl. older hosted models
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

# name -> where it lives. Pull local models first: `ollama pull <id>`.
# Cloud model ids change; check your provider's model list before relying on one.
models:
  local-general:
    provider: ollama
    id: llama3.2:3b
    capabilities: [tools]
    context_tokens: 32000
  local-coder:
    provider: ollama
    id: qwen2.5-coder:7b
    capabilities: [tools]
    context_tokens: 32000
  local-reasoner:
    provider: ollama
    id: deepseek-r1:8b
    context_tokens: 32000
  local-vision:
    provider: ollama
    id: llava:7b
    capabilities: [vision]
    context_tokens: 4096
  legacy-mistral:                              # a "legacy" model: callable by name
    provider: ollama
    id: mistral:7b
    context_tokens: 8192
  claude-sonnet:
    provider: anthropic
    id: claude-sonnet-5-5
    capabilities: [vision, tools]
    context_tokens: 200000
  claude-haiku:
    provider: anthropic
    id: claude-haiku-4-5-20251001
    capabilities: [vision, tools]
    context_tokens: 200000
  gpt:
    provider: openai
    id: gpt-5
    capabilities: [vision, tools]
    context_tokens: 128000

# Routes are tried top-down by signal strength; each lists models in preference
# order. Later models are fallbacks (missing key, model down, rate limit...).
routes:
  code:
    description: Writing, reviewing or debugging code
    models: [claude-sonnet, gpt, local-coder]
    keywords: [code, function, bug, error, stack trace, python, javascript, typescript,
               sql, regex, refactor, unit test, api, docker, bash, compile, exception]
    patterns: ['```', 'Traceback \(most recent call last\)', '\bdef \w+\(', '\bclass \w+']
    examples:
      - Why does this Python function throw a KeyError?
      - Write a SQL query that returns the top 10 customers by revenue
      - Refactor this React component to use hooks
  reasoning:
    description: Math, logic, multi-step analysis and planning
    models: [gpt, claude-sonnet, local-reasoner]
    keywords: [prove, proof, calculate, probability, equation, step by step,
               optimize, trade-off, derive, logic puzzle]
    examples:
      - What is the probability of drawing two aces in a row?
      - Compare these three pricing strategies and pick the best with reasoning
  writing:
    description: Drafting and editing prose
    models: [claude-sonnet, gpt, local-general]
    keywords: [email, draft, rewrite, rephrase, essay, blog, post, tone, proofread,
               summarize, summary, cover letter, linkedin]
    examples:
      - Draft a short follow-up email after a sales call
      - Rewrite this paragraph to sound less formal
  quick:
    description: Short questions and small talk
    models: [local-general, claude-haiku]
    examples:
      - What's the capital of Portugal?
      - Convert 5 miles to kilometres

default_route: quick

# Semantic signal (optional). Must be a LOCAL provider: the prompt is embedded
# there. Enable with `ollama pull nomic-embed-text`, or delete this block.
embeddings:
  provider: ollama
  model: nomic-embed-text
  threshold: 0.55

privacy:
  enabled: true
  builtin_detectors: true          # emails, card numbers, IBANs, API keys, private keys...
  keywords: [confidential, internal only, under nda]
  patterns: []
  on_no_local_model: reject        # reject | allow_cloud

limits:
  max_body_bytes: 20971520
  upstream_timeout_s: 120
  max_fallbacks: 3
  session_ttl_s: 1800

logging:
  path: logs/decisions.jsonl
  log_prompts: false               # keep false: logs then hold metadata only
