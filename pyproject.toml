[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Security-first LLM router: one OpenAI-compatible endpoint that picks the right model per prompt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pyyaml",
]

[project.scripts]
switchboard = "switchboard.__main__:main"

[tool.setuptools]
packages = ["switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
