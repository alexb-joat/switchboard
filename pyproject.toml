[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trioditis"
version = "0.3.0"
description = "Security-first LLM router: one OpenAI-compatible endpoint that picks the right model per prompt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/alexb-joat/trioditis"
Issues = "https://github.com/alexb-joat/trioditis/issues"
Security = "https://github.com/alexb-joat/trioditis/security/policy"

[project.scripts]
trioditis = "trioditis.__main__:main"

[tool.setuptools]
packages = ["trioditis", "trioditis_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
